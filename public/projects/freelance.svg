<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Left: layered Laravel DDD structure. Right: top page load time cut by 40% after moving from jQuery to Vue.js</title>
  <rect width="800" height="500" fill="#e6ebea"/>

  <!-- Left: DDD layers -->
  <text x="30" y="44" font-size="18" font-weight="700" fill="#142a2c">Laravel + DDD rebuild</text>
  <text x="30" y="68" font-size="14" fill="#4a5c5e">Job site for freelance IT engineers (simplified)</text>
  <g font-size="15">
    <rect x="30" y="96" width="340" height="66" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
    <text x="200" y="135" text-anchor="middle" fill="#142a2c">Presentation · controllers, views</text>
    <rect x="30" y="176" width="340" height="66" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
    <text x="200" y="215" text-anchor="middle" fill="#142a2c">Application · use cases</text>
    <rect x="30" y="256" width="340" height="66" rx="6" fill="#f4f6f5" stroke="#0b5a8a" stroke-width="2.5"/>
    <text x="200" y="295" text-anchor="middle" font-weight="700" fill="#0b5a8a">Domain · entities, rules</text>
    <rect x="30" y="336" width="340" height="66" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
    <text x="200" y="375" text-anchor="middle" fill="#142a2c">Infrastructure · DB, repositories</text>
  </g>
  <text x="200" y="442" text-anchor="middle" font-size="14" fill="#4a5c5e">Easier to maintain · fewer bugs</text>

  <line x1="410" y1="40" x2="410" y2="460" stroke="#c2cccb" stroke-width="2"/>

  <!-- Right: load time -->
  <text x="450" y="44" font-size="18" font-weight="700" fill="#142a2c">jQuery → Vue.js</text>
  <text x="450" y="68" font-size="14" fill="#4a5c5e">Salon site top page, load time</text>
  <text x="450" y="150" font-size="15" fill="#142a2c">Before (jQuery)</text>
  <rect x="450" y="162" width="310" height="44" rx="4" fill="#c2cccb"/>
  <text x="450" y="262" font-size="15" fill="#142a2c">After (Vue.js)</text>
  <rect x="450" y="274" width="186" height="44" rx="4" fill="#0b5a8a"/>
  <text x="652" y="304" font-size="22" font-weight="700" fill="#0b5a8a">−40%</text>
  <text x="450" y="372" font-size="14" fill="#4a5c5e">Measured with Chrome DevTools</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
