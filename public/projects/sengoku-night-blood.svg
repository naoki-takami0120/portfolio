<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Simplified backend architecture: players, PHP app servers, Redis and Memcached cache, sharded MySQL</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#142a2c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#e6ebea"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#142a2c">Simplified backend architecture</text>
  <text x="30" y="64" font-size="14" fill="#4a5c5e">2M downloads in under a month · 600K pre-registrations</text>

  <!-- Players -->
  <rect x="30" y="190" width="150" height="120" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
  <text x="105" y="242" text-anchor="middle" font-size="17" font-weight="700" fill="#142a2c">Players</text>
  <text x="105" y="266" text-anchor="middle" font-size="14" fill="#4a5c5e">iOS · Android</text>

  <!-- App servers -->
  <rect x="250" y="140" width="190" height="220" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
  <text x="345" y="172" text-anchor="middle" font-size="17" font-weight="700" fill="#142a2c">PHP app servers</text>
  <rect x="275" y="192" width="140" height="40" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <rect x="275" y="242" width="140" height="40" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <rect x="275" y="292" width="140" height="40" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <text x="345" y="217" text-anchor="middle" font-size="14" fill="#4a5c5e">app</text>
  <text x="345" y="267" text-anchor="middle" font-size="14" fill="#4a5c5e">app</text>
  <text x="345" y="317" text-anchor="middle" font-size="14" fill="#4a5c5e">app</text>

  <!-- Cache -->
  <rect x="540" y="90" width="230" height="140" rx="6" fill="#f4f6f5" stroke="#0b5a8a" stroke-width="2"/>
  <text x="655" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#0b5a8a">Cache</text>
  <rect x="560" y="138" width="190" height="34" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <rect x="560" y="180" width="190" height="34" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <text x="655" y="160" text-anchor="middle" font-size="14" fill="#142a2c">Redis</text>
  <text x="655" y="202" text-anchor="middle" font-size="14" fill="#142a2c">Memcached</text>

  <!-- Sharded MySQL -->
  <rect x="540" y="270" width="230" height="190" rx="6" fill="#f4f6f5" stroke="#0b5a8a" stroke-width="2"/>
  <text x="655" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#0b5a8a">MySQL (sharded)</text>
  <rect x="560" y="318" width="190" height="34" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <rect x="560" y="360" width="190" height="34" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <rect x="560" y="402" width="190" height="34" rx="4" fill="#ffffff" stroke="#c2cccb"/>
  <text x="655" y="340" text-anchor="middle" font-size="14" fill="#142a2c">Shard 1</text>
  <text x="655" y="382" text-anchor="middle" font-size="14" fill="#142a2c">Shard 2</text>
  <text x="655" y="424" text-anchor="middle" font-size="14" fill="#142a2c">Shard N</text>

  <!-- Arrows -->
  <path d="M180 250H246" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440 210C490 210 490 160 536 160" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440 290C490 290 490 365 536 365" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
