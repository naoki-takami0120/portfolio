<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Two-week release cycle: new battle skill, backend API in PHP, test, deploy with shell scripts</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#142a2c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#e6ebea"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#142a2c">Two-week release cycle</text>
  <text x="30" y="64" font-size="14" fill="#4a5c5e">New battle skills for a real-time 5-vs-5 team battle game</text>

  <!-- cycle boxes -->
  <rect x="60" y="130" width="300" height="110" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
  <text x="210" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#142a2c">1. New battle skill</text>
  <text x="210" y="204" text-anchor="middle" font-size="14" fill="#4a5c5e">planned for the next release</text>

  <rect x="440" y="130" width="300" height="110" rx="6" fill="#f4f6f5" stroke="#0b5a8a" stroke-width="2"/>
  <text x="590" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0b5a8a">2. Backend API</text>
  <text x="590" y="204" text-anchor="middle" font-size="14" fill="#4a5c5e">PHP · code review</text>

  <rect x="440" y="320" width="300" height="110" rx="6" fill="#f4f6f5" stroke="#c2cccb" stroke-width="2"/>
  <text x="590" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#142a2c">3. Test &amp; bug fixes</text>
  <text x="590" y="394" text-anchor="middle" font-size="14" fill="#4a5c5e">before every release</text>

  <rect x="60" y="320" width="300" height="110" rx="6" fill="#f4f6f5" stroke="#0b5a8a" stroke-width="2"/>
  <text x="210" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#0b5a8a">4. Deploy</text>
  <text x="210" y="394" text-anchor="middle" font-size="14" fill="#4a5c5e">shell scripts → production</text>

  <!-- arrows -->
  <path d="M360 185H436" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M590 240V316" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440 375H364" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M210 320V244" stroke="#142a2c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#142a2c">every 2 weeks</text>
